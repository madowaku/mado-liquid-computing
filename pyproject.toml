[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mado-liquid-computing-lab"
version = "0.0.1"
description = "Reproducible evidence-first liquid computing research harness"
requires-python = ">=3.10"
[project.scripts]
mlc = "liquid_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
